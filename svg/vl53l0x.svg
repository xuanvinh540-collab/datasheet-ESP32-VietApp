<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <g id="pin">
      <circle cx="0" cy="0" r="3.2" fill="#D4AF37" stroke="#9A7B1C" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <style>
      .pin-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 5.6px; fill: #FFFFFF; font-weight: bold; text-anchor: middle; }
      .header-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #E5D4F0; font-weight: bold; text-anchor: middle; letter-spacing: 0.5px; }
      .sub-title { font-family: monospace; font-size: 6px; fill: #C8A8DE; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>

  <!-- Purple GY-530 PCB Substrate -->
  <rect x="8" y="8" width="134" height="134" rx="7" fill="#4B1D66" stroke="#311044" stroke-width="2"/>

  <!-- Mounting Holes -->
  <circle cx="18" cy="18" r="4" fill="#111111" stroke="#D4AF37" stroke-width="1.4"/>
  <circle cx="132" cy="18" r="4" fill="#111111" stroke="#D4AF37" stroke-width="1.4"/>
  <circle cx="18" cy="132" r="4" fill="#111111" stroke="#D4AF37" stroke-width="1.4"/>
  <circle cx="132" cy="132" r="4" fill="#111111" stroke="#D4AF37" stroke-width="1.4"/>

  <!-- 5-Pin Header Box -->
  <rect x="23" y="13" width="106" height="15" rx="2" fill="#18121E"/>

  <!-- Pins: VCC, GND, SCL, SDA, XSHUT -->
  <use href="#pin" x="34" y="21"/>
  <text x="34" y="35" class="pin-label">VCC</text>

  <use href="#pin" x="54" y="21"/>
  <text x="54" y="35" class="pin-label">GND</text>

  <use href="#pin" x="75" y="21"/>
  <text x="75" y="35" class="pin-label">SCL</text>

  <use href="#pin" x="96" y="21"/>
  <text x="96" y="35" class="pin-label">SDA</text>

  <use href="#pin" x="118" y="21"/>
  <text x="118" y="35" class="pin-label">XSHUT</text>

  <!-- Module Title -->
  <text x="75" y="48" class="header-title">VL53L0X ToF LASER</text>

  <!-- LDO Regulator & SMD Passives -->
  <rect x="24" y="64" width="16" height="10" rx="1" fill="#1A1A1A" stroke="#555" stroke-width="0.6"/>
  <rect x="26" y="82" width="10" height="5" fill="#C29B61" stroke="#D4AF37" stroke-width="0.5"/>
  <rect x="112" y="66" width="10" height="5" fill="#C29B61" stroke="#D4AF37" stroke-width="0.5"/>
  <rect x="112" y="80" width="10" height="5" fill="#1F1F1F" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Central VL53L0X Optical Sensor Package -->
  <rect x="52" y="58" width="46" height="62" rx="4" fill="#1B1918" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="57" y="63" width="36" height="52" rx="2" fill="#2A2624"/>
  <!-- Emitter & SPAD Receiver Windows -->
  <circle cx="75" cy="76" r="8" fill="#0B0B0D" stroke="#7A5C38" stroke-width="1.2"/>
  <circle cx="75" cy="76" r="3.5" fill="#FF1744" opacity="0.85"/>
  <rect x="65" y="92" width="20" height="16" rx="2" fill="#0B0B0D" stroke="#7A5C38" stroke-width="1.2"/>
  <rect x="69" y="96" width="12" height="8" rx="1" fill="#304FFE" opacity="0.55"/>

  <text x="75" y="133" class="sub-title">GY-530 · I2C 0x29</text>
</svg>
