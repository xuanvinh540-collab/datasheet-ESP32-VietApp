<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 160" width="100%" height="100%">
  <defs>
    <g id="pin">
      <circle cx="0" cy="0" r="3.2" fill="#D4AF37" stroke="#9A7B1C" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <style>
      .pin-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 5.8px; fill: #FFFFFF; font-weight: bold; text-anchor: middle; }
      .header-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64FFDA; font-weight: bold; text-anchor: middle; letter-spacing: 0.5px; }
      .chip-text { font-family: monospace; font-size: 5.8px; fill: #B0BEC5; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>

  <!-- Matte Black PCB Substrate (Rounded Bottom like INMP441 Breakout) -->
  <rect x="8" y="8" width="134" height="144" rx="22" fill="#171B1E" stroke="#2F383E" stroke-width="2"/>

  <!-- 5-Pin Header Box -->
  <rect x="23" y="13" width="104" height="15" rx="2" fill="#0D1012"/>

  <!-- Pins: VCC, GND, SCK, WS, SD -->
  <use href="#pin" x="34" y="21"/>
  <text x="34" y="35" class="pin-label">VCC</text>

  <use href="#pin" x="54" y="21"/>
  <text x="54" y="35" class="pin-label">GND</text>

  <use href="#pin" x="75" y="21"/>
  <text x="75" y="35" class="pin-label">SCK</text>

  <use href="#pin" x="96" y="21"/>
  <text x="96" y="35" class="pin-label">WS</text>

  <use href="#pin" x="116" y="21"/>
  <text x="116" y="35" class="pin-label">SD</text>

  <!-- Title -->
  <text x="75" y="48" class="header-title">INMP441 I2S MIC</text>

  <!-- Central Gold Acoustic Port & MEMS Mic Ring -->
  <circle cx="75" cy="96" r="34" fill="#23292E" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3 2"/>
  <rect x="55" y="76" width="40" height="40" rx="5" fill="#B0B8BE" stroke="#788288" stroke-width="1.2"/>
  <circle cx="75" cy="96" r="11" fill="#D4AF37" stroke="#8C6D1F" stroke-width="1.2"/>
  <circle cx="75" cy="96" r="6" fill="#0B0D0E"/>

  <text x="75" y="142" class="chip-text">MEMS 24-BIT · 3.3V</text>
</svg>
