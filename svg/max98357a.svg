<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 175" width="100%" height="100%">
  <defs>
    <g id="pin">
      <circle cx="0" cy="0" r="3.2" fill="#D4AF37" stroke="#9A7B1C" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <style>
      .pin-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 5.6px; fill: #FFFFFF; font-weight: bold; text-anchor: middle; }
      .header-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #FFE082; font-weight: bold; text-anchor: middle; letter-spacing: 0.5px; }
      .chip-text { font-family: monospace; font-size: 5.8px; fill: #DDDDDD; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>

  <!-- Deep Indigo PCB Substrate -->
  <rect x="8" y="8" width="134" height="159" rx="7" fill="#281E5D" stroke="#18113D" stroke-width="2"/>

  <!-- Mounting Holes -->
  <circle cx="18" cy="18" r="4" fill="#111111" stroke="#CCCCCC" stroke-width="1.4"/>
  <circle cx="132" cy="18" r="4" fill="#111111" stroke="#CCCCCC" stroke-width="1.4"/>
  <circle cx="18" cy="157" r="4" fill="#111111" stroke="#CCCCCC" stroke-width="1.4"/>
  <circle cx="132" cy="157" r="4" fill="#111111" stroke="#CCCCCC" stroke-width="1.4"/>

  <!-- 5-Pin Header Box -->
  <rect x="23" y="13" width="104" height="15" rx="2" fill="#141126"/>

  <!-- Pins: VCC, GND, BCLK, LRC, DIN -->
  <use href="#pin" x="34" y="21"/>
  <text x="34" y="35" class="pin-label">VCC</text>

  <use href="#pin" x="54" y="21"/>
  <text x="54" y="35" class="pin-label">GND</text>

  <use href="#pin" x="75" y="21"/>
  <text x="75" y="35" class="pin-label">BCLK</text>

  <use href="#pin" x="96" y="21"/>
  <text x="96" y="35" class="pin-label">LRC</text>

  <use href="#pin" x="116" y="21"/>
  <text x="116" y="35" class="pin-label">DIN</text>

  <!-- Title -->
  <text x="75" y="48" class="header-title">MAX98357A I2S AMP</text>

  <!-- Central MAX98357A QFN IC -->
  <rect x="53" y="58" width="44" height="44" rx="3" fill="#181818" stroke="#555555" stroke-width="1"/>
  <circle cx="59" cy="64" r="1.8" fill="#777777"/>
  <text x="75" y="79" class="chip-text">MAX98357</text>
  <text x="75" y="89" class="chip-text">3W CLASS-D</text>

  <!-- Speaker Terminal Block (Green Screw Terminal) -->
  <rect x="43" y="114" width="64" height="34" rx="3" fill="#008952" stroke="#005B36" stroke-width="1.5"/>
  <circle cx="60" cy="128" r="8" fill="#B0BEC5" stroke="#546E7A" stroke-width="1.2"/>
  <line x1="55" y1="128" x2="65" y2="128" stroke="#37474F" stroke-width="2"/>
  <circle cx="90" cy="128" r="8" fill="#B0BEC5" stroke="#546E7A" stroke-width="1.2"/>
  <line x1="85" y1="128" x2="95" y2="128" stroke="#37474F" stroke-width="2"/>
  <text x="60" y="144" class="pin-label">SPK+</text>
  <text x="90" y="144" class="pin-label">SPK−</text>
</svg>
